[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpcms-offline-sync"
version = "0.1.0"
description = "RPCMS offline sync: durable intake of field-captured assistance records and forwarding to the Duplicate Guard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "pydantic>=2.5", "pydantic-settings>=2.2", "pyjwt>=2.8", "sqlalchemy>=2.0", "uvicorn>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rpcms-sync-worker = "rpcms_offline_sync.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rpcms_offline_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
